<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ayah Loop</title>
<meta name="description" content="Play a list of Quran verses from any surahs on repeat.">
<meta name="theme-color" content="#0e6b53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ayah Loop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column; player with large car-friendly controls first, then the verse queue, then settings */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#15211d; --muted:#5a6a64; --line:#d5ddd9;
  --accent:#0e6b53; --accent-ink:#ffffff; --accent-soft:#e1efe9; --warn:#a1382a; --warn-soft:#f8e6e2; --mark:#fff1c7;
  --arabic:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --sans:"IBM Plex Sans","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1412; --surface:#16201c; --ink:#e4ece9; --muted:#91a39c; --line:#28352f;
  --accent:#3dbd92; --accent-ink:#04120d; --accent-soft:#163128; --warn:#ff8b78; --warn-soft:#3a1c17; --mark:#3b3413; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang="ta"] body{font-family:"Noto Sans Tamil","IBM Plex Sans",system-ui,sans-serif;line-height:1.65}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.lang button{font:inherit;font-size:13px;font-weight:500;border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lang button[lang="ta"]{font-family:"Noto Sans Tamil",system-ui,sans-serif}
.tagline{margin:0;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px;margin-top:-8px}
.tabs button{font:inherit;font-size:15px;font-weight:600;border:0;background:none;color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.pane{display:flex;flex-direction:column;gap:22px}

.har{font-family:var(--arabic);font-size:24px;line-height:2;direction:rtl;text-align:right;margin:0;min-height:3em;overflow-wrap:anywhere}
.har .seg{border-radius:4px;transition:background .15s}
.har .seg.now{background:var(--mark)}
.seg-ctl{display:flex;flex-wrap:wrap;gap:6px}
.seg-ctl button{font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg-ctl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg-ctl small{font-size:12px;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
ol.list.hl li{grid-template-columns:2rem 1fr}
.hl .ref{font-family:var(--mono);font-size:13px;font-weight:500}
.hl .ref span{color:var(--muted);font-family:var(--sans);font-weight:400;margin-left:6px}
.hl .snip{font-family:var(--arabic);font-size:18px;direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hl li>div{min-width:0}
.speed{display:flex;align-items:center;gap:10px;height:44px}
.speed input{flex:1;border:0;background:none;accent-color:var(--accent)}
.speed output{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.checks{display:flex;flex-direction:column;gap:10px}
.checks label{display:flex;align-items:center;gap:10px;margin:0;font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--accent)}

.player{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.np-label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
html[lang="ta"] .np-label{text-transform:none;letter-spacing:0;font-size:13px}
.np-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.np-key{font-family:var(--mono);font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.np-name{font-size:18px;font-weight:500}
.np-meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 10px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.ctl{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ctl svg{width:28px;height:28px;fill:currentColor}
.ctl.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ctl.play svg{width:34px;height:34px}
.ctl:disabled{opacity:.45;cursor:not-allowed}
.status{min-height:1.3em;font-size:13.5px;color:var(--muted);margin:0}
.status.bad{color:var(--warn)}

label,.lbl{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
html[lang="ta"] label,html[lang="ta"] .lbl{text-transform:none;letter-spacing:0;font-size:13px}
textarea,select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;width:100%}
textarea{font-family:var(--mono);font-size:16px;min-height:110px;padding:10px 12px;resize:vertical}
select{padding:10px 12px;height:44px;font-size:16px}
textarea:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
code{font-family:var(--mono);font-size:12.5px;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.row>div{min-width:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);height:44px}
.stepper button{width:40px;height:100%;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
.stepper input{width:44px;border:0;text-align:center;font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;height:100%;border-radius:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}

.summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.summary strong{font-weight:500;font-variant-numeric:tabular-nums}
.summary span{color:var(--muted);font-size:13px}
.errors{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.err{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 7px}
ol.list{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:320px;overflow-y:auto}
ol.list li{display:grid;grid-template-columns:2rem 4.5rem 1fr;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
ol.list li:first-child{border-top:0}
ol.list li.cur{background:var(--accent-soft)}
ol.list li.cur .idx{color:var(--accent);font-weight:600}
.idx{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.key{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:18px 12px;color:var(--muted);text-align:center;display:block!important;cursor:default!important}

.tips{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:8px}
.tips h2{font-size:15px;font-weight:600;margin:0}
.tips p{font-size:13.5px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Ayah Loop</h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langEn" lang="en" aria-pressed="true">English</button>
      <button type="button" id="langTa" lang="ta" aria-pressed="false">தமிழ்</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabQ" aria-controls="paneQ" aria-selected="true" data-i18n="tabQuran"></button>
    <button type="button" role="tab" id="tabH" aria-controls="paneH" aria-selected="false" data-i18n="tabHadith"></button>
  </div>

  <div class="pane" id="paneQ" role="tabpanel" aria-labelledby="tabQ">
  <p class="tagline" data-i18n="tagline"></p>

  <section class="player" aria-live="polite">
    <div class="np-label" data-i18n="nowPlaying"></div>
    <div class="np-head"><span class="np-key" id="npKey">–</span><span class="np-name" id="npName"></span></div>
    <div class="np-meta"><span class="chip" id="npPos"></span><span class="chip" id="npRep"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="controls">
      <button class="ctl" id="prev" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="ctl play" id="play" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="ctl" id="next" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <section>
    <div class="summary"><strong id="count"></strong><span data-i18n="tapHint"></span></div>
    <div class="errors" id="errors"></div>
    <ol class="list" id="list"></ol>
  </section>

  <section>
    <label for="verses" data-i18n="verses"></label>
    <textarea id="verses" spellcheck="false" autocapitalize="off" autocomplete="off">7:40, 18:103, 18:104, 14:35, 2:137, 4:115, 9:100, 7:54, 36:82, 22:73, 5:36, 4:116, 16:36, 42:11, 38:75, 31:13, 5:72, 10:62, 10:63, 20:25, 20:26, 20:27, 20:28, 9:122, 9:28, 8:11, 6:145, 9:108, 15:9, 2:185, 38:29, 47:24, 54:17, 41:42, 4:136, 36:70, 15:9, 16:44, 7:180, 20:8, 12:111, 33:21, 29:61, 10:18, 29:27, 5:2, 33:6, 33:45, 33:46, 3:164, 42:51</textarea>
    <p class="hint" data-i18n-html="hint"></p>
  </section>

  <section class="row">
    <div>
      <label for="reciter" data-i18n="reciter"></label>
      <select id="reciter"></select>
    </div>
    <div>
      <span class="lbl" id="repLbl" data-i18n="playEach"></span>
      <div class="stepper" role="group" aria-labelledby="repLbl">
        <button type="button" id="repDown">−</button>
        <input id="repeats" type="number" inputmode="numeric" min="1" max="50" value="3">
        <button type="button" id="repUp">+</button>
      </div>
    </div>
  </section>

  <section class="tips">
    <h2 data-i18n="tipsTitle"></h2>
    <p data-i18n="tipHome"></p>
    <p data-i18n="tipLoop"></p>
    <p data-i18n="tipData"></p>
  </section>
  </div>

  <div class="pane" id="paneH" role="tabpanel" aria-labelledby="tabH" hidden>
  <p class="tagline" data-i18n="hTagline"></p>

  <section class="player">
    <div class="np-label" data-i18n="nowPlaying"></div>
    <div class="np-head"><span class="np-name" id="hRef">–</span></div>
    <p class="har" id="hText" lang="ar"></p>
    <div class="np-meta"><span class="chip" id="hTopic"></span><span class="chip" id="hPos"></span><span class="chip" id="hRep"></span></div>
    <div class="controls">
      <button class="ctl" id="hPrev" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="ctl play" id="hPlay" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" id="hPlayIcon"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="ctl" id="hNext" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <p class="status" id="hStatus" role="status"></p>
  </section>

  <section>
    <div class="seg-ctl" id="hTopics" role="group"></div>
  </section>

  <section>
    <div class="summary"><strong id="hCount"></strong><span data-i18n="hTap"></span></div>
    <ol class="list hl" id="hList"></ol>
  </section>

  <section>
    <label for="hVoice" data-i18n="voice"></label>
    <select id="hVoice"></select>
  </section>

  <section class="row">
    <div>
      <label for="hRate" data-i18n="speed"></label>
      <div class="speed"><input type="range" id="hRate" min="0.4" max="1.4" step="0.05" value="0.8"><output id="hRateVal" for="hRate"></output></div>
    </div>
    <div>
      <span class="lbl" id="hRepLbl" data-i18n="hPlayEach"></span>
      <div class="stepper" role="group" aria-labelledby="hRepLbl">
        <button type="button" id="hRepDown">−</button>
        <input id="hRepeats" type="number" inputmode="numeric" min="1" max="50" value="3">
        <button type="button" id="hRepUp">+</button>
      </div>
    </div>
  </section>

  <section>
    <label for="hGap" data-i18n="gap"></label>
    <select id="hGap"></select>
  </section>

  <section class="checks">
    <label><input type="checkbox" id="hChunk" checked> <span data-i18n="chunk"></span></label>
    <label><input type="checkbox" id="hStrip"> <span data-i18n="strip"></span></label>
  </section>

  <section class="tips">
    <h2 data-i18n="hTipsTitle"></h2>
    <p data-i18n="hTipScreen"></p>
    <p data-i18n="hTipVoice"></p>
    <p data-i18n="hTipCheck"></p>
  </section>
  </div>
</div>

<script>
const I18N={
  en:{
    tagline:"Pick verses from any surahs. Play them in order, on repeat.",
    nowPlaying:"Now playing", ready:"Ready",
    pos:(i,n)=>`Ayah ${i} of ${n}`, rep:(r,R)=>`Play ${r} of ${R}`,
    play:"Play", pause:"Pause", prev:"Previous verse", next:"Next verse",
    count:n=>`${n} ${n===1?"ayah":"ayahs"}`, tapHint:"Tap a verse to start from it",
    notFound:t=>`Not found: ${t}`, capped:n=>`Kept the first ${n} ayahs`,
    empty:"Add verses below to build the list.",
    verses:"Verses",
    hint:"Use <code>2:255</code> for surah:ayah, <code>18:1-5</code> for a range, or a plain number like <code>231</code> for the ayah's position in the whole Quran (1–6236). Separate with commas, spaces or new lines.",
    reciter:"Reciter", playEach:"Play each", fewer:"Fewer repeats", more:"More repeats", times:"Times to play each ayah",
    tipsTitle:"In the car",
    tipHome:"Add it to your home screen for one-tap access. On iPhone, open this page in Safari, tap Share, then Add to Home Screen. On Android, open the browser menu and tap Add to Home screen.",
    tipLoop:"After the last verse the list starts again. Lock-screen, CarPlay and Android Auto controls work for pause and skip.",
    tipData:"Audio streams from everyayah.com, so it uses mobile data. Pick a 64 kbps reciter to save data. Your list and settings stay saved on this phone.",
    loadErr:"Couldn't load this verse. Skipping to the next.",
    blocked:"Tap Play to start the audio.",
    offline:"No connection. Playback will continue when the network returns.",
    tabQuran:"Quran", tabHadith:"Hadith",
    hTagline:"Hadith from the first chapters of the HGWC 1st-year muthoon, read aloud by your phone's Arabic voice.",
    topics:{all:"All",aqeedah:"Aqeedah",fiqh:"Fiqh",quran:"Quran",seerah:"Seerah"},
    hPos:(i,n)=>`Hadith ${i} of ${n}`, hCount:n=>`${n} hadith`, hTap:"Tap a hadith to start from it",
    hPrev:"Previous hadith", hPlayEach:"Play each", hTimes:"Times to play each hadith", hNext:"Next hadith",
    voice:"Voice", speed:"Speed", gap:"Pause between plays", gapNone:"No pause", sec:n=>`${n} ${n===1?"second":"seconds"}`,
    chunk:"Pause at punctuation", strip:"Read without tashkeel",
    onDevice:"on device", online:"online",
    noVoice:"No Arabic voice on this phone. iPhone: Settings → Accessibility → Spoken Content → Voices → Arabic. Android: Settings → Text-to-speech → Google → Install voice data → Arabic. Then reload this page.",
    noSpeech:"This browser can't read text aloud. Try Safari on iPhone or Chrome on Android.",
    notInBook:"ref not in book",
    hTipsTitle:"Listening tips",
    hTipScreen:"Keep the screen on. Speech stops when the phone locks, so the page keeps the screen awake while playing.",
    hTipVoice:"Voices marked on device work without mobile data. On iPhone, download the enhanced Arabic voice for clearer pronunciation.",
    hTipCheck:"The Arabic was copied from the book with vowel marks added. Check each hadith against the book or your teacher."
  },
  ta:{
    tagline:"எந்த சூராவிலிருந்தும் வசனங்களைத் தேர்ந்தெடுங்கள். அவற்றை வரிசையாக, மீண்டும் மீண்டும் கேளுங்கள்.",
    nowPlaying:"இப்போது ஒலிப்பது", ready:"தயார்",
    pos:(i,n)=>`ஆயத் ${i} / ${n}`, rep:(r,R)=>`முறை ${r} / ${R}`,
    play:"ஒலிக்கச் செய்", pause:"இடைநிறுத்து", prev:"முந்தைய வசனம்", next:"அடுத்த வசனம்",
    count:n=>`${n} ஆயத்துகள்`, tapHint:"எந்த வசனத்திலிருந்தும் தொடங்க அதைத் தட்டுங்கள்",
    notFound:t=>`கிடைக்கவில்லை: ${t}`, capped:n=>`முதல் ${n} ஆயத்துகள் மட்டும் சேர்க்கப்பட்டன`,
    empty:"பட்டியலை உருவாக்க கீழே வசனங்களைச் சேர்க்கவும்.",
    verses:"வசனங்கள்",
    hint:"சூரா:ஆயத்துக்கு <code>2:255</code>, வரம்புக்கு <code>18:1-5</code>, அல்லது முழு குர்ஆனில் ஆயத்தின் வரிசை எண்ணுக்கு <code>231</code> போன்ற எண் (1–6236) பயன்படுத்துங்கள். காற்புள்ளி, இடைவெளி அல்லது புதிய வரியால் பிரிக்கவும்.",

function parse(text){

    if(parts.length===1){out.push(a.g);continue;}
    const b=parseEnd(parts[1],a.surah);
    if(!b||b.g<a.g){errors.push(tok);continue;}
    for(let g=a.g;g<=b.g;g++)out.push(g);

    const h=list[idx],t=T();
    const box=$("hText");box.textContent="";
    if(h){segments(h.ar).forEach((s,i)=>{const sp=document.createElement("span");sp.className="seg";sp.dataset.i=i;sp.textContent=s;box.appendChild(sp);});}
    $("hRef").textContent=h?h.ref+(h.refInBook===false?` (${t.notInBook})`:""):"–";
    $("hTopic").textContent=h?topicLabel(h):"";$("hTopic").hidden=!h;
    $("hPos").textContent=h?t.hPos(idx+1,list.length):t.hCount(0);
    $("hRep").textContent=t.rep(Math.min(rep,reps()),reps());$("hRep").hidden=!h;
    markSeg(seg);paintButtons();
    document.querySelectorAll("#hList li[data-i]").forEach(li=>li.classList.toggle("cur",+li.dataset.i===idx));
    if(h)store.set("hl.cur",h.id);
  }
  function markSeg(seg){
    document.querySelectorAll("#hText .seg.now").forEach(s=>s.classList.remove("now"));
    if(seg==="all")document.querySelectorAll("#hText .seg").forEach(s=>s.classList.add("now"));
    else if(seg!=null){const s=document.querySelector(`#hText .seg[data-i="${seg}"]`);if(s)s.classList.add("now");}
  }
  function paintButtons(){
    const t=T();
    $("hPlayIcon").innerHTML=playing?PAUSE:PLAY;
    $("hPlay").setAttribute("aria-label",playing?t.pause:t.play);
    $("hPrev").setAttribute("aria-label",t.hPrev);$("hNext").setAttribute("aria-label",t.hNext);
    $("hPlay").disabled=$("hPrev").disabled=$("hNext").disabled=!list.length||!synth;
  }
  function paintSettings(){
    const t=T();
    $("hRateVal").textContent=(+S.rate).toFixed(2)+"×";
    const g=$("hGap");g.textContent="";
    for(const s of GAPS){const o=document.createElement("option");o.value=s;o.textContent=s?t.sec(s):t.gapNone;g.appendChild(o);}
    g.value=String(GAPS.includes(S.gap)?S.gap:1);
    $("hRepDown").setAttribute("aria-label",t.fewer);$("hRepUp").setAttribute("aria-label",t.more);$("hRepeats").setAttribute("aria-label",t.hTimes);
  }

  // ---- playback ----
  async function lockScreen(on){
    try{
      if(on&&"wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}
      if(!on&&wake){await wake.release();wake=null;}
    }catch(e){}
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&playing)lockScreen(true);});

  function speakParts(parts,g,done){
    let i=0;
    const step=()=>{
      if(g!==gen)return;
      if(i>=parts.length){done();return;}
      const {text,seg}=parts[i++];
      if(!text){step();return;}
      const u=new SpeechSynthesisUtterance(text);
      const v=voices.find(v=>v.voiceURI===S.voice);if(v){u.voice=v;u.lang=v.lang;}else u.lang="ar-SA";
      u.rate=S.rate;
      let finished=false;
      const fin=()=>{if(finished)return;finished=true;clearTimeout(safety);if(g===gen)step();};
      // Some iOS builds never fire onend; move on after a generous estimate.
      const safety=setTimeout(fin,(text.length*0.25/S.rate+6)*1000);
      u.onstart=()=>{if(g===gen)markSeg(seg);};
      u.onend=fin;u.onerror=e=>{if(e.error==="interrupted"||e.error==="canceled")return;fin();};
      keep=u; // keep a reference so Chrome doesn't drop the utterance mid-speech
      synth.speak(u);
    };
    step();
  }
  function playCurrent(){
    const h=list[idx];if(!h||!playing)return;
    const g=++gen;paintCurrent();
    const parts=S.chunk?segments(h.ar).map((s,i)=>({text:speechText(h,s),seg:i})):[{text:speechText(h,h.ar),seg:"all"}];
    speakParts(parts,g,()=>{
      markSeg(null);
      timer=setTimeout(()=>{
        if(g!==gen)return;
        if(rep<reps()){rep++;playCurrent();}
        else go(idx+1);
      },S.gap*1000);
    });
  }
  function go(i){
    if(!list.length)return;
    gen++;clearTimeout(timer);if(synth)synth.cancel();
    idx=((i%list.length)+list.length)%list.length;rep=1;paintCurrent();
    const li=document.querySelector(`#hList li[data-i="${idx}"]`);if(li)li.scrollIntoView({block:"nearest"});
    if(playing)setTimeout(playCurrent,60);
  }
  function start(){
    if(!synth||!list.length)return;
    if(window.AyahTab)window.AyahTab.pause();
    playing=true;lockScreen(true);playCurrent();
  }
  function stop(){playing=false;gen++;clearTimeout(timer);if(synth)synth.cancel();lockScreen(false);markSeg(null);paintButtons();}

  $("hPlay").addEventListener("click",()=>{playing?stop():start();});
  $("hNext").addEventListener("click",()=>go(idx+1));
  $("hPrev").addEventListener("click",()=>go(idx-1));
  const pick=li=>{if(!li)return;playing=true;if(window.AyahTab)window.AyahTab.pause();lockScreen(true);go(+li.dataset.i);};
  $("hList").addEventListener("click",e=>pick(e.target.closest("li[data-i]")));
  $("hList").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const li=e.target.closest("li[data-i]");if(li){e.preventDefault();pick(li);}}});

  $("hVoice").addEventListener("change",e=>{S.voice=e.target.value;store.set("hl.voice",S.voice);});
  $("hRate").addEventListener("input",e=>{S.rate=+e.target.value;store.set("hl.rate",S.rate);paintSettings();});
  $("hGap").addEventListener("change",e=>{S.gap=+e.target.value;store.set("hl.gap",S.gap);});
  $("hChunk").addEventListener("change",e=>{S.chunk=e.target.checked;store.set("hl.chunk",S.chunk?"1":"0");});
  $("hStrip").addEventListener("change",e=>{S.strip=e.target.checked;store.set("hl.strip",S.strip?"1":"0");});
  const setReps=n=>{$("hRepeats").value=n;store.set("hl.reps",reps());paintCurrent();};
  $("hRepeats").addEventListener("input",()=>{store.set("hl.reps",reps());paintCurrent();});
  $("hRepDown").addEventListener("click",()=>setReps(Math.max(1,reps()-1)));
  $("hRepUp").addEventListener("click",()=>setReps(Math.min(50,reps()+1)));

  window.HadithTab={
    stop,
    setLang(l){lang=l;const id=list[idx]&&list[idx].id;paintSettings();loadVoices();buildList(id);paintStatus();}
  };
  paintSettings();buildList(curId);
  if(synth){loadVoices();synth.addEventListener?synth.addEventListener("voiceschanged",loadVoices):(synth.onvoiceschanged=loadVoices);setTimeout(loadVoices,800);}
  else{statusKey="noSpeech";paintStatus();paintButtons();}
})();
</script>
</body>
